el:
  decidim:
    components:
      idra:
        name: Κατάλογοι Urbreath
        floating_help_html: >
          <div>
            <h2>Σε αυτήν την ενότητα</h2>
            <p>Οι χρήστες μπορούν να αναζητήσουν σύνολα δεδομένων από διάφορες πύλες ανοιχτών δεδομένων εισάγοντας λέξεις-κλειδιά ή επιλέγοντας μια ετικέτα από το σύννεφο.</p>
            <p>Η φιλτράρισμα μπορεί να γίνει βάσει ετικέτας, μορφής ή άδειας από τα πλευρικά μενού. Τα αποτελέσματα μπορούν να ταξινομηθούν κατά ημερομηνία ή όνομα και να επιλεγεί πόσα θα εμφανιστούν.</p>
            <p>Κάθε αποτέλεσμα εμφανίζει τίτλο, περιγραφή, μορφή, άδεια, ημερομηνία δημοσίευσης και άλλες σχετικές πληροφορίες.</p>
            <p>Τα σύνολα δεδομένων μπορούν να αποθηκευτούν στα αγαπημένα κάνοντας κλικ στο κίτρινο αστέρι ( <span style="color: var(--warning); transform: scale(2); display: inline-block;">★</span> ).</p>
            <p>Τα αγαπημένα παραμένουν πάντα διαθέσιμα και μπορούν να χρησιμοποιηθούν σε συστατικά DECIDIM ή σε σχόλια.</p>
            <p>Τα αγαπημένα είναι διαθέσιμα από:</p>
            <ul>
              <li>Τον πίνακα ελέγχου διαχείρισης (μέσω του εικονιδίου αστεριού);</li>
              <li>Την ενότητα σχολίων (μόνο σε λειτουργία ανάγνωσης).</li>
            </ul>
            <h2>Κύριες λειτουργίες:</h2>
            <h3>Αναζήτηση και ανακάλυψη</h3>
            <ul>
              <li>Αναζήτηση με λέξεις-κλειδιά, ετικέτες, κατηγορίες και άλλα κριτήρια.</li>
              <li>Λεπτομερής προβολή με τίτλο, τύπο, περιγραφή, ημερομηνία δημοσίευσης, συγγραφείς.</li>
              <li>Προσθήκη ή αφαίρεση από τα αγαπημένα.</li>
            </ul>
            <h3>Αναφορά</h3>
            <ul>
              <li>Άμεση εισαγωγή συνόλων δεδομένων σε κείμενα (π.χ. προτάσεις, ιστολόγια) μέσω του επεξεργαστή.</li>
              <li>Χρήση δεδομένων για υποστήριξη της συζήτησης και της ανάλυσης.</li>
            </ul>
          </div>
    idra:
      download_file: Λήψη αρχείου
      clear_filters: Εκκαθάριση φίλτρων
      delete_confirmation:
        title: Διαγραφή συνόλου δεδομένων;
        body: Είστε σίγουροι ότι θέλετε να αφαιρέσετε αυτό το σύνολο δεδομένων από τα αγαπημένα;
        confirm: Διαγραφή
        cancel: Ακύρωση
